[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "square-drive-connector"
version = "0.1.0"
description = "Private-LAN receiver and archival parser for Square Golf CSV exports"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1.0,<2", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
square-drive = "square_drive_connector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["square_drive_connector*"]
