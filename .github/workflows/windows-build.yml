name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[test,build]"

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build executable
        shell: pwsh
        run: .\build_exe.ps1

      - name: Smoke-check executable
        shell: pwsh
        run: |
          & .\dist\square-drive.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "square-drive.exe --help exited with code $LASTEXITCODE"
          }

      - name: Upload Windows install bundle
        uses: actions/upload-artifact@v4
        with:
          name: square-drive-windows-x64
          path: "dist/install/"
          if-no-files-found: error
          retention-days: 14
